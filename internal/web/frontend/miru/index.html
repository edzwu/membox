<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miru — Paste Markdown to start reading</title>
  <meta name="description" content="Miru is a lightweight Markdown reader. Paste Markdown or open a portable Miru annotation bundle.">
  <script>
    (function(){
      var t='light';
      try{var s=localStorage.getItem('miru-theme');if(s==='dark'||s==='light')t=s;}
      catch(e){}
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M6 4h12v16H6V4zm2 2v12h8V6H8zm2 2h4v2h-4V8zm0 4h4v2h-4v-2z"/>
        </svg>
        <span class="brand-name">Miru</span>
      </div>
    </div>
    <!-- Host integrations may inject document navigation here. -->
    <div class="topbar-center"></div>
    <div class="topbar-actions">
      <button type="button" class="action toc-toggle" id="toc-toggle" aria-expanded="false" aria-controls="toc-nav" hidden>
        <span>Contents</span>
      </button>
      <button type="button" class="action fold-toggle" id="fold-toggle" aria-label="Toggle all sections" title="Toggle all sections" hidden>
        <span class="fold-icon" aria-hidden="true">⊟</span>
      </button>
      <button type="button" class="action theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="toc" id="toc" aria-label="Table of contents">
      <button type="button" class="toc-pin" id="toc-pin" aria-label="Toggle contents" title="Toggle contents">
        <svg class="toc-pin-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
        </svg>
      </button>
      <nav class="toc-nav" id="toc-nav"></nav>
    </aside>
    <div class="toc-backdrop" id="toc-backdrop" hidden></div>
    <main class="main">
      <article class="article" id="article"></article>
    </main>
  </div>

  <div class="empty" id="empty">
    <div class="empty-inner">
      <h1 class="empty-title">Miru<span class="empty-cn">「見」</span></h1>
      <p class="empty-subtitle">Markdown in, read uncluttered.</p>
      <kbd class="empty-kbd" id="empty-kbd">⌘V</kbd>
      <p class="empty-hints">Drop Markdown or code · Outline &amp; fold · Annotate</p>
      <p class="empty-footer">
        Your content stays in this browser.<br>
        Inspired by wonderful <a href="https://github.com/tw93/kami" target="_blank" rel="noopener">Kami</a> and <a href="https://github.com/earendil-works/ray" target="_blank" rel="noopener">Ray</a>.
      </p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <button type="button" class="html-all" id="html-all" aria-label="Download site (.zip)" title="Download site (.zip)" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M12 3l8 4v10l-8 4-8-4V7l8-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M12 12l8-4M12 12v9M12 12L4 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="copy-png" id="copy-png" aria-label="Copy PNG" title="Copy PNG" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="8" y="6" width="8" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="10" cy="8" r="0.8" fill="currentColor"/>
      <path d="M8 15l2-2 2 2 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="png-all" id="png-all" aria-label="Export as PNG" title="Export as PNG" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="8" cy="9" r="1.5" fill="currentColor"/>
      <path d="M3 16l5-5 4 4 6-6 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="download-all" id="download-all" aria-label="Download Markdown" title="Download Markdown" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M12 3v12m0 0-4-4m4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="copy-all" id="copy-all" aria-label="Copy Markdown" title="Copy Markdown" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </button>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/texmath.js"></script>
  <script src="vendor/contrib/auto-render.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
