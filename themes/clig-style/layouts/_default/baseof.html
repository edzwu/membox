<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        })();
    </script>

    <title>
        {{ block "title" . }}
            {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}
        {{ end }}
    </title>

    <meta name="description" content="{{ .Site.Params.description }}" />

    <link rel="stylesheet" media="screen" href="{{ "css/main.css" | relURL }}?v=9">
</head>
<body
    class="{{ if .IsHome }}home{{ else if eq .Kind "section" }}list-page{{ else if eq .Layout "about" }}about-page{{ else if .IsPage }}single-page{{ end }}"
    data-site-title="{{ .Site.Title }}"
>
    {{ if and .IsPage (ne .Layout "about") }}
    <button id="menu-button">Contents</button>
    <aside class="page-toc">
        <a href="/notes/" class="toc-back">← notes</a>
        {{ .TableOfContents }}
    </aside>
    <button class="theme-toggle theme-toggle-article" aria-label="Toggle theme">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    {{ end }}

    {{ if not (and .IsPage (ne .Layout "about")) }}
    <header class="site-nav">
        <a href="/" class="nav-logo" aria-label="Home">
            <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <rect x="4" y="4" width="32" height="32" rx="5"/>
                <polyline points="12,14 8,20 12,26"/>
                <line x1="17" y1="26" x2="28" y2="26"/>
            </svg>
        </a>
        <nav class="nav-links">
            <a href="/" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
            <a href="/notes/" {{ if eq .RelPermalink "/notes/" }}aria-current="page"{{ end }}>Notes</a>
            <a href="/about/">About</a>
        </nav>
        <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </header>
    {{ end }}

    {{ block "main" . }}{{ end }}

    <div class="repl-search">
        <span class="repl-prompt">&gt;</span>
        <input type="text" id="home-search" placeholder="search notes..." autocomplete="off">
    </div>

    <script src="{{ "js/main.js" | relURL }}?v=2"></script>
</body>
</html>
