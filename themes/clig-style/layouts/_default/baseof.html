<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <title>
        {{ block "title" . }}
            {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}
        {{ end }}
    </title>

    <meta name="description" content="{{ .Site.Params.description }}" />

    <link rel="stylesheet" media="screen" href="{{ "css/main.css" | relURL }}?v=6">
</head>
<body
    class="{{ if .IsHome }}home{{ else if eq .Kind "section" }}list-page{{ else if eq .Layout "about" }}about-page{{ else if .IsPage }}single-page{{ end }}"
    data-site-title="{{ .Site.Title }}"
>
    {{ if and .IsPage (ne .Layout "about") }}
    <button id="menu-button">Contents</button>
    <aside class="page-toc">
        <a href="/notes/" class="toc-back">← notes</a>
        {{ .TableOfContents }}
    </aside>
    {{ end }}

    {{ if not (and .IsPage (ne .Layout "about")) }}
    <header class="site-nav">
        <a href="/" class="nav-logo" aria-label="Home">
            <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <rect x="4" y="4" width="32" height="32" rx="5"/>
                <polyline points="12,14 8,20 12,26"/>
                <line x1="17" y1="26" x2="28" y2="26"/>
            </svg>
        </a>
        <nav class="nav-links">
            <a href="/" {{ if .IsHome }}aria-current="page"{{ end }}>Home</a>
            <a href="/notes/" {{ if eq .RelPermalink "/notes/" }}aria-current="page"{{ end }}>Notes</a>
            <a href="/about/">About</a>
        </nav>
    </header>
    {{ end }}

    {{ block "main" . }}{{ end }}

    <div class="repl-search">
        <span class="repl-prompt">&gt;</span>
        <input type="text" id="home-search" placeholder="search notes..." autocomplete="off">
    </div>

    <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
