{{ define "main" }}
<main class="about-main">
    <h1 class="about-title">{{ .Title }}</h1>

    <img src="/images/logo.svg" alt="logo" class="about-logo">

    {{ if .Content }}
    <div class="about-intro">
        {{ .Content }}
    </div>
    {{ end }}

    <div class="timeline">
        {{ range .Params.timeline }}
        <div class="timeline-item">
            <div class="timeline-header">
                <div class="timeline-header-main">
                    <span class="timeline-role">{{ .role }}</span>
                    <span class="timeline-sep">@</span>
                    <span class="timeline-org">{{ .org }}</span>
                    {{ if .dept }}
                    <span class="timeline-dept">{{ .dept }}</span>
                    {{ end }}
                </div>
                <span class="timeline-period">{{ .period }}</span>
            </div>
            <div class="timeline-desc">{{ .desc }}</div>
        </div>
        {{ end }}
    </div>
</main>
{{ end }}
